<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #030006; --glass-bg: rgba(12, 5, 20, 0.6); --glass-border: rgba(168, 85, 247, 0.15); --accent: #a855f7; --text: #f8f8fa; --text-dim: #8a8a9e; --input-bg: rgba(0, 0, 0, 0.4); --font-sans: 'Inter', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; background-image: radial-gradient(circle at 50% 0%, #150726 0%, var(--bg) 70%); }
        .admin-wrapper { width: 100%; max-width: 1100px; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo::before { content: ''; display: block; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; backdrop-filter: blur(20px); }
        .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 600; color: var(--text); }
        .stat-card .value.active { color: #6ee7b7; }
        .stat-card .value.lifetime { color: #d8b4fe; }
        .stat-card .value.banned { color: #fca5a5; }

        .toolbar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 14px 18px; background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; color: var(--text); font-family: var(--font-sans); outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1); }
        button { padding: 14px 20px; border: none; border-radius: 12px; background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%); color: white; font-weight: 500; font-family: var(--font-sans); cursor: pointer; transition: 0.3s; white-space: nowrap; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }
        .btn-gray { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text); }
        .btn-gray:hover { background: rgba(255, 255, 255, 0.1); box-shadow: none; }

        .user-list { display: flex; flex-direction: column; gap: 15px; }
        .user-row { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px 25px; backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between; gap: 20px; transition: 0.3s; }
        .user-row:hover { background: rgba(25, 10, 40, 0.7); border-color: rgba(168, 85, 247, 0.3); }
        
        .u-info { flex: 1; min-width: 150px; }
        .u-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .u-hwid { font-size: 12px; color: var(--text-dim); font-family: monospace; }
        
        .u-status { width: 120px; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; }
        .badge.active { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.expired { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.lifetime { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
        .badge.banned { background: rgba(239, 68, 68, 0.3); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); }

        .u-sub { width: 130px; font-size: 13px; color: var(--text-dim); }
        .u-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .btn-sm { padding: 8px 12px; font-size: 12px; border-radius: 8px; }
        .btn-ban { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-ban:hover { background: rgba(239, 68, 68, 0.3); box-shadow: none; transform: none; }
        .btn-unban { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-unban:hover { background: rgba(16, 185, 129, 0.3); box-shadow: none; transform: none; }

        #msg-box { font-size: 13px; text-align: center; padding: 12px; border-radius: 12px; margin-bottom: 20px; display: none; }
        #msg-box.success { display: block; background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.2); }
        #msg-box.error { display: block; background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .user-row { flex-direction: column; align-items: flex-start; }
            .u-actions { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <div class="header">
            <div class="logo">Admin Panel</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-gray" onclick="window.location.href='index.html'">На сайт</button>
            </div>
        </div>

        <div id="msg-box"></div>

        <div class="stats-grid">
            <div class="stat-card"><div class="label">Всего юзеров</div><div class="value" id="stat-total">0</div></div>
            <div class="stat-card"><div class="label">Активных</div><div class="value active" id="stat-active">0</div></div>
            <div class="stat-card"><div class="label">Lifetime</div><div class="value lifetime" id="stat-lifetime">0</div></div>
            <div class="stat-card"><div class="label">Забанено</div><div class="value banned" id="stat-banned">0</div></div>
        </div>

        <div class="toolbar">
            <input type="text" id="search-input" placeholder="Поиск по логину или HWID..." style="flex: 1;" oninput="renderList()">
            <button onclick="generateKey()">Сгенерировать ключ</button>
            <button class="btn-gray" onclick="fetchUsers()">Обновить</button>
        </div>

        <div class="user-list" id="user-list"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://ygvlepfhxmyyquqaasea.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZWrKzrdxwja5xLDnrOLUeg_e9tneO0T";
        const { createClient } = supabase;
        const dbClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];

        function showMsg(text, type = 'success') {
            const box = document.getElementById('msg-box');
            box.className = type; box.innerText = text;
            setTimeout(() => { box.className = ''; box.innerText = ''; }, 3000);
        }

        async function fetchUsers() {
            // Проверка на админа
            const { data: authData } = await dbClient.auth.getUser();
            if (!authData.user) {
                window.location.href = 'index.html'; return;
            }

            const { data, error } = await dbClient.rpc('admin_list_users');
            if (error) {
                alert("Ошибка доступа. Убедитесь, что вы админ.");
                window.location.href = 'index.html'; return;
            }
            
            // RPC возвращает массив объектов, но без username. Подтянем его из email
            allUsers = (data || []).map(u => {
                const name = u.email ? u.email.split('@')[0] : 'unknown';
                return { ...u, username: name };
            });
            renderList();
        }

        function renderList() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('user-list');
            list.innerHTML = '';

            let activeCount = 0, lifeCount = 0, banCount = 0;
            const now = new Date();

            const filtered = allUsers.filter(u => 
                u.username.toLowerCase().includes(search) || (u.hwid && u.hwid.toLowerCase().includes(search))
            );

            filtered.forEach(u => {
                if (u.is_banned) banCount++;
                else if (u.is_lifetime) lifeCount++;
                else if (u.subscription_until && new Date(u.subscription_until) > now) activeCount++;

                let badgeClass = 'expired', badgeText = 'Нет подписки', subText = '-';

                if (u.is_banned) {
                    badgeClass = 'banned'; badgeText = 'Забанен';
                } else if (u.is_lifetime) {
                    badgeClass = 'lifetime'; badgeText = 'Lifetime'; subText = 'Навсегда';
                } else if (u.subscription_until && new Date(u.subscription_until) > now) {
                    badgeClass = 'active'; badgeText = 'Активен';
                    subText = new Date(u.subscription_until).toLocaleDateString('ru-RU');
                }

                const row = document.createElement('div');
                row.className = 'user-row';
                row.innerHTML = `
                    <div class="u-info">
                        <div class="u-name">${u.username}</div>
                        <div class="u-hwid">${u.hwid || 'HWID: Не привязан'}</div>
                    </div>
                    <div class="u-status"><span class="badge ${badgeClass}">${badgeText}</span></div>
                    <div class="u-sub">До: ${subText}</div>
                    <div class="u-actions">
                        <button class="btn-sm btn-gray" onclick="grantSub('${u.id}', 1)">+1д</button>
                        <button class="btn-sm btn-gray" onclick="grantSub('${u.id}', 7)">+7д</button>
                        <button class="btn-sm btn-gray" onclick="grantSub('${u.id}', 30)">+30д</button>
                        <button class="btn-sm" style="background:#a855f7" onclick="grantSub('${u.id}', 0)">Life</button>
                        ${u.is_banned 
                            ? `<button class="btn-sm btn-unban" onclick="banUser('${u.id}', false)">Разбан</button>`
                            : `<button class="btn-sm btn-ban" onclick="banUser('${u.id}', true)">Бан</button>`
                        }
                        <button class="btn-sm btn-ban" onclick="resetHwid('${u.id}')">Сброс HWID</button>
                    </div>
                `;
                list.appendChild(row);
            });

            document.getElementById('stat-total').innerText = allUsers.length;
            document.getElementById('stat-active').innerText = activeCount;
            document.getElementById('stat-lifetime').innerText = lifeCount;
            document.getElementById('stat-banned').innerText = banCount;
        }

        window.grantSub = async function(userId, days) {
            const { data, error } = await dbClient.rpc('admin_grant_subscription', { p_user_id: userId, p_days: days });
            if (error || !data.ok) return showMsg("Ошибка выдачи", "error");
            showMsg(days === 0 ? "Выдан Lifetime" : `Выдано ${days} дней`);
            fetchUsers();
        };

        window.banUser = async function(userId, isBanned) {
            const { data, error } = await dbClient.rpc('admin_set_ban', { p_user_id: userId, p_banned: isBanned, p_reason: isBanned ? 'Решение администратора' : null });
            if (error || !data.ok) return showMsg("Ошибка бана", "error");
            showMsg(isBanned ? "Юзер забанен" : "Юзер разбанен");
            fetchUsers();
        };

        window.resetHwid = async function(userId) {
            if (!confirm("Сбросить HWID этому юзеру?")) return;
            // Прямой запрос (если разрешено RLS админу) или через RPC, если напишешь позже.
            const { error } = await dbClient.from('profiles').update({ hwid: null }).eq('id', userId);
            if (error) return showMsg("Ошибка сброса", "error");
            showMsg("HWID сброшен");
            fetchUsers();
        };

        window.generateKey = async function() {
            const { data, error } = await dbClient.rpc('admin_create_invite', { p_max_uses: 1 });
            if (error || !data) return showMsg("Ошибка генерации", "error");
            showMsg(`Ключ: ${data} (Скопирован в консоль)`);
            console.log(`%c[Ключ] ${data}`, 'color:#a855f7;font-size:16px;font-weight:bold;');
        };

        fetchUsers();
    </script>
</body>
</html>
